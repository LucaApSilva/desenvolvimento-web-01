<!DOCTYPE html>
<html lang="en">

<head>
    <title>layoult-desafio-final</title>
    <style>
        #nav {
            display: flex;

        }

        .nav_retangulo_menor {
            background-color: #a4c7ec;

        }

        .nav_retangulo_maior {
            background-color: #a4c7ec;
            height: 100px;
            width: 500px;

        }

        #secao01 {
            display: flex;
            align-items: center;
            justify-content: space-evenly;

            background-color: #bc1953;
            height: 500px;
            width: 100%;

        }

        .secao01_retangulo_maior {
            height: 100px;
            width: 500px;

        }

        .secao01_retangulo_menor {

            width: 300px;

        }

        #secao02 {
            display: flex;
            align-items: center;
            justify-content: space-around;
            background-color: #ce9a32;
            height: 500px;
            width: 100%;
        }

        .secao02 {
            background-color: #FAF7BB;
            height: 300px;
            width: 300px;
        }

        #secao03 {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            background-color: #c7521c;

            width: 100%;

            background-color: black;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .secao03_retangulo03 {

            width: 500px;
        }

            width: 300px;

            align-items: center;
            justify-content: space-evenly;
            background-color: #7ebeb2;
            height: 800px;
            width: 100%;
        }

        .secao04_main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 200px;
            width: 400px;
            background-color: #d1f3db;
        }

        .secao04__circulo {
            height: 100px;
            width: 100px;
            border-radius: 50%;

        }

        .secao04__retangulo {
            height: 100px;
            width: 200px;
            background-color: #da9c3c;
        }

            display: flex;
            align-items: center;
            justify-content: space-evenly;

            height: 800px;
            width: 100%;

        }

            height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .secao05_retangulo_pequeno {

            width: 200px;
            background-color: #da9c3c;

    </div>

        </div>

        </div>

    </div>
