<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="wrapper">
            <div id="logo">
                <img src="img/logo.svg" alt="Cofre de moedas em formato de porco">
                <h1> <span>IF Investimentos </span></h1>

            </div>
            <div class="nav">
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="bolsas.html">Bolsas</a></li>
                        <li><a href="cadastro.html">Cadastro</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <div class="wrapper">
            
            <h1>Cadastro</h1>
            <form>
                <label for="nameUser"> Nome:</label>
                <input type="text" name="nameUser" id="nameUser" placeholder="Nome">
                
                <label for="surnameUser"> Sobrenome:</label>
                <input type="text" name="surnameUser" id="surnameUser" placeholder="Sobrenome">
                
                <label for="passawordUser"> Senha:</label>
                <input type="password" name="passwordUser" id="passwordUser" >
            
                 <h3> Qual seu perfil de investidor?</h3>

                 <div>
                     <input type="radio" name="perfilInvestidor" id="agressivo" value="Agressivo">
                     <label for="agressivo"> Agressivo</label>
                 </div>

                 <div>
                     <input type="radio" name="perfilInvestidor" id="moderado" value="moderado">
                     <label for="moderado"> Moderado</label>
                 </div>

                 <div>
                     <input type="radio" name="perfilInvestidor" id="cagao" value="Cagão">
                     <label for="cagao"> Cagão</label>
                 </div>

                 
                 <h3> Quais tipos de investimentos prefere?</h3> 

                 
                 <div>
                     <input type="checkbox" name="investimentos" id="poupanca" value="poupanca">
                     <label for="poupanca"> Poupanca</label>
                 </div>

                 <div>
                     <input type="checkbox" name="investimentos" id="CDB" value="CDB">
                     <label for="CDB"> CDB</label>
                 </div>

                 <div>
                     <input type="checkbox" name="investimentos" id="bitcoin" value="bitcoin">
                     <label for="bitcoin"> Bitcoin</label>
                 </div>

                  <div>
                     <input type="checkbox" name="investimentos" id="fundoImobiliario" value="fi">
                     <label for="fundoImobiliario"> Fundo Imobiliario</label>
                 </div>

            </form>

               


        </div>



    </main>
    <footer>
        <div class="wrapper">

        </div>
    </footer>


</body>
</html>
